[workspace]
resolver = "2"
members = [
    "crates/manager-core",
    "crates/manager-app",
    "crates/manager-infra",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stardew Mod Manager Contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
uuid = { version = "1.15", features = ["v4", "serde"] }
ts-rs = { version = "12.0", features = ["chrono-impl", "uuid-impl"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "blocking"] }
directories = "6.0"
async-trait = "0.1"
tauri = { version = "2.2", features = [] }
tauri-build = { version = "2.0" }
tauri-plugin-dialog = "2"
manager-core = { path = "crates/manager-core" }
manager-app = { path = "crates/manager-app" }
manager-infra = { path = "crates/manager-infra" }
