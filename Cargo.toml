[workspace]
resolver = "2"
members = [
    "crates/manager-core",
    "crates/manager-infra",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stardew Mod Manager Contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.2", features = [] }
tauri-build = { version = "2.0" }
manager-core = { path = "crates/manager-core" }
manager-infra = { path = "crates/manager-infra" }
