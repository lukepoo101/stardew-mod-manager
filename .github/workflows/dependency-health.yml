name: Dependency health

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies / Audit + Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Validate Renovate configuration
        # Resolve the validator's dependencies from releases at least three days
        # (259200 s) old, so a half-published upstream release cannot fail this
        # required check. --bun runs it on Bun rather than whatever Node the
        # runner image has. --ignore-scripts skips the native re2 build, which
        # Bun cannot load; Renovate then validates regexes with JavaScript
        # RegExp and logs a warning saying so.
        run: bunx --bun --ignore-scripts --minimum-release-age 259200 --package renovate@44.216.2 renovate-config-validator --strict --no-global renovate.json

      - name: Audit JavaScript lockfile
        if: ${{ !cancelled() }}
        run: bun audit

      - name: Install pinned Cargo audit
        id: cargo-audit
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust lockfile
        if: ${{ !cancelled() && steps.cargo-audit.outcome == 'success' }}
        run: cargo audit --deny unsound

      - name: Save complete Rust advisory report
        if: ${{ always() && steps.cargo-audit.outcome == 'success' }}
        # Run outside the checkout so the report includes repository exceptions.
        working-directory: ${{ runner.temp }}
        run: cargo audit --json --file "$GITHUB_WORKSPACE/Cargo.lock" > "$GITHUB_WORKSPACE/rust-audit.json"

      - name: Upload Rust advisory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-audit
          path: rust-audit.json
          if-no-files-found: ignore
