name: Dependency health

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies / Audit + Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.132.4 -- renovate-config-validator --strict --no-global renovate.json

      - name: Enable repository-pinned pnpm
        if: ${{ !cancelled() }}
        run: corepack enable

      - name: Audit JavaScript lockfile
        if: ${{ !cancelled() }}
        run: pnpm audit

      - name: Install pinned Cargo audit
        id: cargo-audit
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust lockfile
        if: ${{ !cancelled() && steps.cargo-audit.outcome == 'success' }}
        run: cargo audit --deny unsound

      - name: Save complete Rust advisory report
        if: ${{ always() && steps.cargo-audit.outcome == 'success' }}
        # Run outside the checkout so the report includes repository exceptions.
        working-directory: ${{ runner.temp }}
        run: cargo audit --json --file "$GITHUB_WORKSPACE/Cargo.lock" > "$GITHUB_WORKSPACE/rust-audit.json"

      - name: Upload Rust advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-audit
          path: rust-audit.json
          if-no-files-found: ignore
