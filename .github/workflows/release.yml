name: Release

# Publishing is a deliberate act: a version tag or an explicit manual run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, without a leading v
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the release version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  linux:
    name: Build Linux bundles
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:46
    steps:
      - name: Install native packaging dependencies
        run: |
          dnf install -y \
            git gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel openssl-devel \
            libappindicator-gtk3-devel librsvg2-devel libxdo-devel \
            curl tar xz unzip python3 \
            webkitgtk6.0 xorg-x11-server-Xvfb xorg-x11-xauth
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js and repository-pinned pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable repository-pinned pnpm
        run: corepack enable
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the Rust workspace
        run: cargo test --workspace --locked
      - name: Build Linux bundles
        run: pnpm desktop:build:linux
      - name: Smoke-test packaged application
        run: xvfb-run -a python3 scripts/native-smoke.py --output native-smoke-results
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: |
            target/release/bundle/rpm/*.rpm
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
      - name: Upload Linux smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-smoke-results
          path: native-smoke-results/
          if-no-files-found: ignore

  windows:
    name: Build and sign Windows installers
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    # Signing credentials live in this environment, so they are only reachable
    # for a release that a protected branch or an approval has authorised.
    environment: release
    env:
      # A base64 PKCS#12 export and its password. Both are absent on a fork or
      # in a repository that has not configured signing, and the pipeline then
      # produces a clearly-labelled unsigned build instead of failing silently.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable repository-pinned pnpm
        run: corepack enable
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      # The frontend is embedded at compile time, so it is built before the
      # Rust workspace is compiled.
      - name: Build the frontend
        run: pnpm build
      - name: Test the Rust workspace on Windows
        run: cargo test --workspace --locked
      - name: Build NSIS and MSI installers
        run: pnpm desktop:build:windows
      - name: Import the signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $imported) { throw 'the signing certificate could not be imported' }
          "SIGN_THUMBPRINT=$($imported.Thumbprint)" >> $env:GITHUB_ENV
      - name: Sign the application executable and installers
        if: ${{ env.SIGN_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem 'target/release/Stardew Mod Manager.exe' -ErrorAction SilentlyContinue
          $targets += Get-ChildItem 'target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          $targets += Get-ChildItem 'target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          if ($targets.Count -eq 0) { throw 'no release artifacts were found to sign' }
          foreach ($target in $targets) {
            Write-Host ('Signing ' + $target.FullName)
            $result = Set-AuthenticodeSignature -FilePath $target.FullName -Certificate (Get-Item "Cert:\CurrentUser\My\$env:SIGN_THUMBPRINT") -TimestampServer $env:WINDOWS_TIMESTAMP_URL -HashAlgorithm SHA256
            if ($result.Status -ne 'Valid') { throw ('signing ' + $target.Name + ' failed with ' + $result.Status) }
          }
      - name: Verify every signature
        if: ${{ env.SIGN_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem 'target/release/Stardew Mod Manager.exe' -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem 'target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem 'target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          $invalid = @()
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            Write-Host ($artifact.Name + ' -> ' + $signature.Status)
            if ($signature.Status -ne 'Valid') { $invalid += $artifact.Name }
          }
          if ($invalid.Count -gt 0) { throw ('unsigned or invalid artifacts: ' + ($invalid -join ', ')) }
      - name: WebView2 smoke test
        shell: pwsh
        run: |
          $binary = Resolve-Path 'target/release/Stardew Mod Manager.exe'
          python scripts/native-smoke.py --binary $binary --output native-smoke-results --require-webview2
      - name: Install, start, and uninstall the NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA 'Stardew Mod Manager'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw ('the installer exited with ' + $install.ExitCode) }
          $installed = Join-Path $installDir 'Stardew Mod Manager.exe'
          if (-not (Test-Path $installed)) { throw 'the installed executable is missing' }
          $app = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw 'the installed application exited immediately' }
          Stop-Process -Id $app.Id -Force
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
      - name: Write a signing summary
        shell: pwsh
        run: |
          $signed = if ($env:SIGN_THUMBPRINT) { 'true' } else { 'false' }
          "SIGNED=$signed" >> $env:GITHUB_ENV
      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Upload Windows smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-smoke-results
          path: native-smoke-results/
          if-no-files-found: ignore

  publish:
    name: Publish the GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Stardew Mod Manager ${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/windows-installers/**/*.exe
            artifacts/windows-installers/**/*.msi
            artifacts/linux-bundles/**/*.rpm
            artifacts/linux-bundles/**/*.deb
            artifacts/linux-bundles/**/*.AppImage
            artifacts/SHA256SUMS.txt