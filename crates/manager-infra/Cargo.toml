[package]
name = "manager-infra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
manager-core.workspace = true
manager-app.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
zip.workspace = true
sha2.workspace = true
fs2.workspace = true
tracing.workspace = true
tempfile.workspace = true
chrono.workspace = true
libc.workspace = true
uuid.workspace = true
directories.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["stream", "blocking"] }
tokio.workspace = true
futures-util = "0.3"
# Nexus Mods identifies its files by MD5.
md5 = { package = "md-5", version = "0.11" }

# The GitHub token and Nexus API key live in the system keychain, never in
# the manager's files.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.0", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.0", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.0", features = ["apple-native"] }

[dev-dependencies]
tempfile.workspace = true

